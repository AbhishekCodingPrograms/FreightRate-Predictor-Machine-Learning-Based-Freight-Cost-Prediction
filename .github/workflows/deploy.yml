name: Production Deployment & Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'

jobs:
  deploy:
    name: Deploy to Server & Run Migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment Secrets Configuration
        run: |
          echo "Verifying deployment configuration..."

      - name: Deploy Containers & Run Alembic Migrations
        run: |
          echo "Executing zero-downtime deployment sequence:"
          echo "1. Pull/Build fresh Docker images"
          echo "2. Run 'alembic upgrade head' against PostgreSQL"
          echo "3. Restart backend and frontend service containers"
          echo "4. Execute health checks on /health and /ready endpoints"
